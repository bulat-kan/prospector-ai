[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector-ai"
version = "0.1.0"
description = "Local Streamlit MVP for sales analytics and commission projections."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "streamlit>=1.35",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
